<style>
:root{
  --bg:#F6FAF9;
  --surface:#FFFFFF;
  --ink:#1B2A32;
  --muted:#5C6B73;
  --line:#D9E4E1;
  --brand:#0E7C6B;
  --brand-ink:#0A5D50;
  --brand-soft:#E4F2EF;
  --accent:#B45309;
  --accent-soft:#FEF3C7;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,42,50,.05),0 10px 28px rgba(27,42,50,.07);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--brand-soft)}

/* ===== 顶部导航 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--brand-ink);text-decoration:none}
.brand svg{flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.top-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#F1F6F4;border:1px solid var(--line);border-radius:999px;padding:6px 14px;width:min(320px,42vw)}
.top-search svg{flex:none;color:var(--muted)}
.top-search input{border:none;background:none;outline:none;font-size:14px;width:100%;color:var(--ink)}
.top-search input::placeholder{color:#8FA0A6}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#EAF5F2 0%,#F6FAF9 70%);border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(14,124,107,.14) 1px,transparent 0);background-size:26px 26px;pointer-events:none}
.hero-inner{position:relative;max-width:1120px;margin:0 auto;padding:56px 20px 42px;display:grid;grid-template-columns:1.4fr .9fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(26px,4vw,38px);line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--brand-ink)}
.hero h1 span{display:block;font-size:.55em;font-weight:600;color:var(--muted);margin-top:10px;letter-spacing:.01em}
.hero p{margin-top:16px;max-width:44em;color:var(--muted);font-size:15px}
.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--surface);padding:18px 20px}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--brand);line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* ===== 工具栏 ===== */
.toolbar{max-width:1120px;margin:26px auto 0;padding:0 20px}
.toolbar-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar-top h2{font-size:17px;font-weight:700;margin-right:auto}
.result-count{font-size:13px;color:var(--muted)}
.sort-select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips-label{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== 卡片网格 ===== */
.grid{max-width:1120px;margin:18px auto 60px;padding:0 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 4px 10px rgba(27,42,50,.08),0 16px 36px rgba(27,42,50,.1)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card-img{flex:none;width:150px;min-height:150px;background:#EEF4F2;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.card-title h3{font-size:16px;font-weight:700;line-height:1.3}
.card-title .spec{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;line-height:1;padding:4px 8px;border-radius:4px;background:#F1F6F4;color:var(--muted);border:1px solid var(--line)}
.tag.brand-tag{background:var(--brand-soft);color:var(--brand-ink);border-color:#CBE5DF}
.tag.disease-tag{background:#FBF6EC;color:#8A5A10;border-color:#EBD9B4}
.card-meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;font-size:12px;color:var(--muted)}
.price{font-size:15px;font-weight:800;color:var(--brand)}
.price::before{content:"¥ ";font-size:12px;font-weight:600}

/* ===== 空态 ===== */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-overlay{position:absolute;inset:0;background:rgba(27,42,50,.5);backdrop-filter:blur(3px)}
.modal-box{position:relative;background:var(--surface);border-radius:14px;max-width:820px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(27,42,50,.25)}
.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;gap:12px;z-index:2}
.modal-head h3{font-size:18px;font-weight:700}
.modal-head .spec{font-size:14px;color:var(--muted)}
.modal-close{margin-left:auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.modal-close:hover{background:#F1F6F4;color:var(--ink)}
.modal-body{padding:22px;display:grid;grid-template-columns:280px 1fr;gap:24px}
.modal-img{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#EEF4F2;align-self:start}
.modal-img img{width:100%;height:auto;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
.detail-item{border-bottom:1px solid var(--line);padding-bottom:10px}
.detail-item.wide{grid-column:1/-1}
.detail-item dt{font-size:12px;color:var(--muted);margin-bottom:4px}
.detail-item dd{font-size:14px;font-weight:600;word-break:break-word}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* ===== 页脚 ===== */
footer{border-top:1px solid var(--line);background:var(--surface);padding:28px 20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
footer b{color:var(--brand-ink)}

/* ===== 响应式 ===== */
@media (max-width:860px){
  .hero-inner{grid-template-columns:1fr;padding:40px 20px 32px;gap:24px}
  .modal-body{grid-template-columns:1fr}
  .modal-img{max-width:320px;margin:0 auto}
}
@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .card{flex-direction:column}
  .card-img{width:100%;height:180px}
  .topbar-inner{flex-wrap:wrap}
  .top-search{order:3;width:100%;margin-left:0}
  .detail-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

const state = {q:"",mfr:"all",dis:"all",sort:"default"};
const grid = document.getElementById("grid");
const countEl = document.getElementById("resultCount");

function firstPrice(p){const m=String(p).match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):Infinity;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function filtered(){
  let list = D.map((p,i)=>({...p,idx:i}));
  if(state.mfr!=="all") list=list.filter(p=>p.m===state.mfr);
  if(state.dis!=="all") list=list.filter(p=>p.d===state.dis);
  const q=state.q.trim().toLowerCase();
  if(q) list=list.filter(p=>[p.n,p.m,p.s,p.i,p.o].join(" ").toLowerCase().includes(q));
  if(state.sort==="price-asc") list.sort((a,b)=>firstPrice(a.pr)-firstPrice(b.pr));
  if(state.sort==="price-desc") list.sort((a,b)=>firstPrice(b.pr)-firstPrice(a.pr));
  return list;
}

function card(p){
  const img = IMG[p.n] || "";
  return `<button class="card" data-idx="${p.idx}" aria-label="查看 ${esc(p.n)} ${esc(p.s)} 详情">
    <div class="card-img"><img src="${img}" alt="${esc(p.n)} 产品图" loading="lazy"></div>
    <div class="card-body">
      <div class="card-title"><h3>${esc(p.n)}</h3><span class="spec">${esc(p.s)}</span></div>
      <div class="tags">
        <span class="tag brand-tag">${esc(p.m)}</span>
        <span class="tag">${esc(p.o)}</span>
        ${p.d?`<span class="tag disease-tag">${esc(p.d)}</span>`:""}
        ${p.i?`<span class="tag">${esc(p.i)}</span>`:""}
      </div>
      <div class="card-meta">
        <span class="price">${esc(p.pr)}</span>
        ${p.pk?`<span>包装 ${esc(p.pk)}</span>`:""}
        ${p.du?`<span>疗程 ${esc(p.du)}</span>`:""}
      </div>
    </div>
  </button>`;
}

function render(){
  const list=filtered();
  grid.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有符合条件的药品，试试调整筛选或搜索词。</div>`;
  countEl.textContent = `共 ${list.length} 款`;
}

const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");
const modalTitle=document.getElementById("modalTitle");
const modalSpec=document.getElementById("modalSpec");
const modalDetail=document.getElementById("modalDetail");

function openModal(p){
  modalTitle.textContent=p.n;
  modalSpec.textContent=p.s;
  modalImg.src=IMG[p.n]||"";
  modalImg.alt=p.n+" 产品图";
  const rows=[
    ["生产厂家",p.m],["产地",p.o],["疾病类型",p.d],["适应症",p.i],["靶点",p.t],
    ["是否需检测报告",p.r],["规格",p.s],["包装",p.pk],["用药时长/盒",p.du],
    ["参考价格（人民币）",p.pr],["通关税费",p.tx],["物流厂家",p.lg],["物流周期",p.lc],["物流费用",p.lf]
  ];
  modalDetail.innerHTML=rows.filter(r=>r[1]).map(([k,v])=>`<div class="detail-item${["适应症","靶点","用药时长/盒","物流费用"].includes(k)?" wide":""}"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  modal.classList.add("open");
  document.body.style.overflow="hidden";
  modal.querySelector(".modal-close").focus();
}
function closeModal(){modal.classList.remove("open");document.body.style.overflow="";}

grid.addEventListener("click",e=>{
  const b=e.target.closest(".card");
  if(!b)return;
  openModal(D[+b.dataset.idx]);
});
modal.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeModal();});

document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("sortSelect").addEventListener("change",e=>{state.sort=e.target.value;render();});
document.getElementById("mfrChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  state.mfr=b.dataset.mfr;
  document.querySelectorAll("#mfrChips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  render();
});
document.getElementById("diseaseChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  state.dis=b.dataset.dis;
  document.querySelectorAll("#diseaseChips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  render();
});

render();
</script>
